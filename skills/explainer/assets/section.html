<section class="xp" aria-label="Narrated explainer">
  <div class="xp-stage">
%STAGE%
  </div>
  <p class="xp-captions"></p>
  <div class="xp-controls">
    <button class="xp-skip" type="button" data-skip="-5" aria-label="Back 5 seconds">−5s</button>
    <button class="xp-play" type="button">Play</button>
    <button class="xp-skip" type="button" data-skip="5" aria-label="Forward 5 seconds">+5s</button>
    <input class="xp-bar" type="range" min="0" value="0" aria-label="Position">
    <span class="xp-time"></span>
    <select class="xp-speed" aria-label="Playback speed"></select>
    <button class="xp-cc" type="button" aria-pressed="false">Captions</button>
    <button class="xp-full" type="button" aria-label="Full screen" title="Full screen"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M1 5V1h4M11 1h4v4M15 11v4h-4M5 15H1v-4" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
  </div>
  <ol class="xp-chapters"></ol>
  <details><summary>Transcript</summary><div class="xp-transcript"></div></details>
  %AUDIO%
  <script type="application/json" id="xp-timings">%TIMINGS%</script>
  <script>%PLAYER%</script>
  <script>
(() => {
const TIMINGS = JSON.parse(document.getElementById("xp-timings").textContent);
%SCENES%
const root = document.querySelector(".xp");
Explainer.mount({ root, timings: TIMINGS, audio: root.querySelector(".xp-audio"), scenes: SCENES });
})();
  </script>
</section>
