<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Style board</title>
<style>
:root { --bg: #f2f2ef; --card: #fff; --fg: #1b1f24; --muted: #5d6670; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #15181c; --card: #1e2227; --fg: #e8ebee; --muted: #9aa3ad; } }
:root[data-theme="dark"] { --bg: #15181c; --card: #1e2227; --fg: #e8ebee; --muted: #9aa3ad; }
body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, sans-serif; }
main { max-width: 1100px; margin: 0 auto; }
h1 { font-size: 1.3rem; margin: 0 0 4px; }
p { margin: 0 0 16px; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
.card { margin: 0; background: var(--card); border-radius: 10px; padding: 10px; }
.card svg { display: block; width: 100%; height: auto; border-radius: 6px; }
figcaption { margin-top: 8px; color: var(--muted); }
figcaption b { color: var(--fg); }
</style>
</head>
<body>
<main>
  <h1>Four looks for “%TITLE%”</h1>
  <p>Each preview loops the same six seconds. Pick one, or ask for a blend.</p>
  <div class="grid">
%CARDS%
  </div>
</main>
<script>const BOARD = %BOARD%;</script>
<script>%BOARDJS%</script>
</body>
</html>
