# PROPOSED. Not installed. Target path: /etc/systemd/system/tmp.mount.d/size.conf
# Caps the /tmp tmpfs at 4G instead of the default 50% of RAM (15G on this host).
# A full /tmp now fails writes with ENOSPC instead of pushing RAM into swap.
# Keep every other option from /usr/lib/systemd/system/tmp.mount.
[Mount]
Options=mode=1777,strictatime,nosuid,nodev,size=4G,nr_inodes=1m,x-systemd.graceful-option=usrquota
